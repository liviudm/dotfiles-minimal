# ─── Prefix & basics ──────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g mouse on

# ─── Reload ───────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ─── Terminal / true-color / OSC 52 clipboard ─────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g set-clipboard on
set -ag terminal-features ",xterm-256color:clipboard,xterm-ghostty:clipboard"
set -as terminal-features ',*:cstyle'

# ─── Copy mode (vi) ───────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v                 send-keys -X begin-selection
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Ctrl+wheel = half-page scroll in copy mode
bind -T copy-mode-vi C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down

# ─── Pane navigation (vim-style) ──────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resize (vim-style, repeatable) ──────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle zoom (maximize) the current pane
bind m resize-pane -Z

# ─── Splits keep cwd; drop the awkward defaults ───────────────────
unbind '"'
unbind %
bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# ─── New session ──────────────────────────────────────────────────
bind C new-session
bind S command-prompt -p "session:" "new-session -s '%%'"

# ─── Plugins ──────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# session persistence
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# theme
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline false
set -g @dracula-show-left-icon "#h | #S"
set -g @dracula-show-battery-status false
set -g @dracula-show-location false
set -g @dracula-plugins " "

# windows / panes
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @power_zoom_trigger 'Z'

# scrollback / links
set -g @plugin 'laktak/extrakto'
set -g @plugin 'alberti42/tmux-fzf-links'
set -g @fzf-links-key 'u'

# command palette (overrides default next-layout on <prefix> Space)
set -g @plugin 'lost-melody/tmux-command-palette'

# sesh popup (Homebrew binary, not a tpm plugin)
bind-key T display-popup -E -w 60% -h 60% "sesh connect \"\$(sesh list -i | fzf --no-sort --ansi --border --border-label ' sesh ' --prompt '⚡  ')\""

# Optional machine-local overrides (before TPM)
source-file -q ~/.tmux.conf.local

# Keep at the very bottom
# Both plugin probes (python) and executable hooks (python3) use the venv.
run-shell 'tmux set-environment -g PATH "$HOME/.local/share/dotfiles-minimal/tmux-python/bin:$PATH"'
run-shell 'PATH="$HOME/.local/share/dotfiles-minimal/tmux-python/bin:$PATH" "$HOME/.tmux/plugins/tpm/tpm"'

# ─── Append ssh:<host> to window status when active pane is SSH'd ────
# Must come AFTER tpm so it overrides dracula's window-status-*-format.
# Colors preserved verbatim from dracula; we only inject the conditional
# " (#{pane_title})" after #W. The zsh ssh wrapper stamps pane_title as
# "ssh:<shorthost>" via OSC 2 when connecting.
set -g window-status-format '#[fg=#f8f8f2]#[bg=#44475a] #I #W#{?#{m:ssh:*,#{pane_title}}, (#{pane_title}),}'
set -g window-status-current-format '#[fg=#44475a]#[bg=#6272a4]#[fg=#f8f8f2]#[bg=#6272a4] #I #W#{?#{m:ssh:*,#{pane_title}}, (#{pane_title}),} #[fg=#6272a4]#[bg=#44475a]'
